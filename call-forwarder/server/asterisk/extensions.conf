[internal]
; Ring the iPhone. If it is not registered yet (iOS suspends the Linphone app
; when it is not in the foreground), keep retrying for ~50s so the call rings as
; soon as the user opens Linphone after the push notification.
exten => iphone,1,NoOp(Calling iphone)
 same => n,Ringing()
 same => n,Set(CALLERID(name)=${PJSIP_HEADER(read,X-Caller)})
 same => n,Set(TRIES=0)
 same => n,While($[${TRIES} < 25])
 same => n,Dial(PJSIP/iphone,30)
 same => n,GotoIf($["${DIALSTATUS}" != "CHANUNAVAIL"]?out)
 same => n,Wait(2)
 same => n,Set(TRIES=$[${TRIES} + 1])
 same => n,EndWhile()
 same => n(out),Hangup()

exten => android,1,NoOp(Calling android)
 same => n,Dial(PJSIP/android,30)
 same => n,Hangup()
